[tool.poetry]
name = "limesurvey_etl"
version = "0.1.0"
description = ""
authors = ["Timo Hartmann <timo.hartmann@posteo.de>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12.0"
pandas = "2.2.*"
SQLAlchemy = "1.4.42"
PyMySQL = "1.0.2"
pyyaml = "6.0.1"
dbt-core = "1.7.*"
dbt-postgres = "1.7.*"
mariadb = "1.1.10"

[tool.poetry.group.dev.dependencies]
mkdocs = "1.5.*"
mkdocstrings-python = "1.7.*"
mkdocs-material = "9.*"
mkdocs-table-reader-plugin = "2.0.*"
pytest = "7.4.*"
testcontainers = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
